<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KhetKhata — farm ledger & profit</title>
<link rel="stylesheet" href="css/app.css?v=8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232e5d3f'/><text x='16' y='23' font-size='17' text-anchor='middle' fill='%23f5f2ea' font-family='serif'>ख</text></svg>">
</head>
<body>

<!-- ===== Onboarding overlay (first run) ===== -->
<div id="onboarding" class="onb hidden"></div>

<!-- ===== App shell ===== -->
<div id="shell" class="shell hidden">
  <aside class="side" id="sidebar"></aside>
  <div class="main">
    <header class="topbar">
      <button class="burger" id="btnBurger" aria-label="menu">☰</button>
      <div class="topbar-title" id="topbarTitle"></div>
      <div class="topbar-right">
        <select id="roleSwitch" class="role-switch" title="View as">
          <option value="farmer">Farmer view — Ramesh</option>
          <option value="fpo">FPO dashboard</option>
          <option value="lender">Lender / Bank view</option>
        </select>
        <button class="lang-chip" id="btnLang" title="Change language">अ/A</button>
        <div class="avatar" id="avatar">र</div>
      </div>
    </header>
    <main id="view" class="view"></main>
    <footer class="foot">
      <span>KhetKhata v0.4.2 · demo build</span>
      <span id="footNote">Data stored in this browser for the demo</span>
    </footer>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal" class="modal-wrap hidden"><div class="modal" id="modalBox"></div></div>

<script src="js/data.js?v=8"></script>
<script src="js/i18n.js?v=8"></script>
<script src="js/engine.js?v=8"></script>
<script src="js/views.js?v=8"></script>
<script src="js/app.js?v=8"></script>
</body>
</html>
